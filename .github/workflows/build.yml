name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          zip=$(ls *.zip | head -n1)
          echo "Found: $zip"
          mkdir -p unzipped
          unzip -q "$zip" -d unzipped
          dir=$(dirname "$(find unzipped -name settings.gradle | head -n1)")
          echo "Project dir: $dir"
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: KimikbKeyboard-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
